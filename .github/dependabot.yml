# Dependabot configuration for automated dependency updates

version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    assignees:
      - "FrankAndreas"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Non-major updates in one PR, majors on their own
      non-major:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]

  # Docker
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days after a release before proposing it
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
      - "docker"
