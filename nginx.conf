# Handwriting traces: each POST body is appended as one JSON line to
# /var/log/traces/traces.jsonl inside the container (see docs/deploy-nas.md)
log_format trace escape=none '$request_body';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/traces {
        limit_except POST { deny all; }
        client_max_body_size    512k;
        client_body_buffer_size 512k;   # keeps the body in memory, so $request_body is set
        access_log /var/log/traces/traces.jsonl trace if=$request_body;
        proxy_pass http://127.0.0.1/__trace_sink;
    }

    # Only there so nginx reads the body above; an empty 204 for anyone else too
    location = /__trace_sink {
        access_log off;
        return 204;
    }

    # All routes fall back to index.html (hash routing handles the rest client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed JS/CSS assets produced by Vite
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Medium cache for images and fonts
    location ~* \.(svg|png|jpg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # No cache for content JSON (allows updating game data without a full rebuild)
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
